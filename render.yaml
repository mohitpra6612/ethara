services:
  - type: web
    name: inventrack-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inventrack-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://inventrack.vercel.app
    plan: free

  - type: pserv
    name: inventrack-db
    runtime: postgresql
    plan: free
    databases:
      - name: inventrack-db
